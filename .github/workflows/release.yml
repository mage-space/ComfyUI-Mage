name: Release

# release-please keeps a release pull request open from the conventional
# commits on main. Merging it tags the release and publishes the node pack to
# the Comfy Registry.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    # Idle until the release bot is configured (see README.md).
    if: vars.MAGE_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Create a bot token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MAGE_BOT_APP_ID }}
          private-key: ${{ secrets.MAGE_BOT_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to the Comfy Registry
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: comfy-registry
    steps:
      - uses: Comfy-Org/publish-node-action@1.0.1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
