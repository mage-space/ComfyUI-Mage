name: Release

# release-please keeps a release pull request open from the conventional
# commits on main. Merging it tags the release and publishes the node pack to
# the Comfy Registry. Running it by hand publishes an existing tag, such as the
# first release, v0.0.0.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v0.0.0
        required: true

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    # Idle until the release bot is configured (see README.md).
    if: github.event_name == 'push' && vars.MAGE_BOT_APP_ID != ''
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create a bot token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MAGE_BOT_APP_ID }}
          private-key: ${{ secrets.MAGE_BOT_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to the Comfy Registry
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch'
      || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    environment: comfy-registry
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: Comfy-Org/publish-node-action@1.0.1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: 'true'
